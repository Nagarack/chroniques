# Chroniques derrière nginx. Certificat HTTPS : sudo certbot --nginx -d jeu.mondomaine.fr
# 1. Remplacez jeu.mondomaine.fr (4 fois) par votre domaine.
# 2. Copiez ce fichier dans /etc/nginx/sites-available/chroniques, activez-le
#    (ln -s ../sites-available/chroniques /etc/nginx/sites-enabled/), puis : sudo nginx -t && sudo systemctl reload nginx
# 3. Côté Chroniques : CHRONIQUES_PROXY=standard (voir chroniques.service).
server {
    listen 80;
    listen [::]:80;
    server_name jeu.mondomaine.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jeu.mondomaine.fr;
    ssl_certificate     /etc/letsencrypt/live/jeu.mondomaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeu.mondomaine.fr/privkey.pem;

    # Images, sons d'ambiance (20 Mo) et paquets de mise à jour (40 Mo).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                                  # vérifié par Chroniques
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # adresse du visiteur (limite des essais de connexion)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Flux en direct (/api/events) : rien n'est retenu, connexion longue.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
